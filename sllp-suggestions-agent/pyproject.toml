[project]
name = "sllp-suggestions-agent"
version = "0.1.0"
description = "A2A writing-suggestions agent for SLLP assessments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "prometheus-client>=0.21,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# pytest --cov=app → coverage.xml (Cobertura, read by Jenkins' Coverage plugin) + htmlcov/.
[tool.coverage.run]
branch = true
source = ["app"]
