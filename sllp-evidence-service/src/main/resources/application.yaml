server:
  port: 8092

spring:
  application:
    name: sllp-evidence-service
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 0.3

sllp:
  audit:
    ingest-url: ${AUDIT_INGEST_URL:http://localhost:8086/internal/audit-events}
    ingest-secret: ${AUDIT_INGEST_SECRET:}
  public-base-url: ${EVIDENCE_PUBLIC_BASE_URL:http://localhost:8092}
  a2a-token: ${EVIDENCE_AGENT_TOKEN:}
  ai-usage:
    provider: OPENAI
    default-model: gpt-4o-mini
    pricing-version: openai-gpt-4o-mini-2026-08
    input-price-micros-per-million: 150000
    cached-input-price-micros-per-million: 75000
    output-price-micros-per-million: 600000
  services:
    # Host-facing ports from docker-compose.yaml (each service's container port is unchanged;
    # only the host-side mapping moved to 1<port>). This service isn't containerized yet, so it
    # reaches its dependencies the same way a browser or Postman on the host would.
    composition-service-url: http://localhost:18083
    admin-service-url: http://localhost:18086
    user-service-url: http://localhost:18082
