      3. Helping at the Market
      Composition: On Sunday morning, I went to the market with Mum. The market was crowded and noisy. Mum bought carrots, fish and a bag of oranges. The bags looked heavy, so I carried the oranges for her. One orange rolled onto the floor. A kind uncle picked it up and gave it back to me. I thanked him. At home, Mum smiled and said that I was a helpful child. I felt proud because I had made her work easier.
