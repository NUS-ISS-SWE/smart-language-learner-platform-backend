global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sllp-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [user-service:8082, composition-service:8083, document-service:8089, subscription-service:8084, admin-service:8086, api-gateway:8080, product-guide-service:8087]

  - job_name: sllp-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: [orchestrator-service:8090]

  - job_name: sllp-assessment-agents
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [evidence-agent:8092, grading-agent:8093, review-agent:8094]

  - job_name: sllp-suggestions-agent
    metrics_path: /metrics
    static_configs:
      - targets: [suggestions-agent:8091]
