apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clamav-database
  namespace: sllp
  labels:
    app.kubernetes.io/name: clamav
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sllp-auto-ebs-gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: sllp
  labels:
    app.kubernetes.io/name: clamav
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # The signature database uses a single ReadWriteOnce EBS volume. Stop the
    # old pod before starting its replacement to avoid a multi-attach failure.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: clamav
          image: clamav/clamav:1.4_base
          imagePullPolicy: Always
          command:
            - /init-unprivileged
          env:
            - name: CLAMAV_NO_CLAMD
              value: "false"
            - name: CLAMAV_NO_FRESHCLAMD
              value: "false"
            - name: CLAMAV_NO_MILTERD
              value: "true"
            - name: FRESHCLAM_CHECKS
              value: "24"
            - name: TZ
              value: UTC
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          volumeMounts:
            - name: database
              mountPath: /var/lib/clamav
            - name: temporary-files
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/clamav
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: clamav-database
        - name: temporary-files
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: sllp
  labels:
    app.kubernetes.io/name: clamav
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clamav
  ports:
    - name: clamd
      protocol: TCP
      port: 3310
      targetPort: clamd
