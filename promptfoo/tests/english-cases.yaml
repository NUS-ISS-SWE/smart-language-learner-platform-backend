    anchors: |-
      1. The Broken Window
      Composition: After school, Ravi and me played ball at the corridor. Teacher say we must not play there but outside was hot. Ravi kick the ball very hard. It fly past me and hit the classroom window. The glass make a loud sound and broke. We was scared. Ravi said we should run away, so we hide near the toilet. I keep thinking about the window and feel bad. Later, the cleaner saw us and asked why we were there. I told her nothing happened. Then our form teacher came. She knew somebody broke it because another boy see us. The class became quiet when they heard about it. Ravi blamed me and I blamed him. Teacher was angry because we lied. We say sorry and our parents had to pay. I learn not to play ball there and not tell lies because it make everything more worse.
      Calibrated bands: TASK_IDEAS=2, ORGANISATION_COHESION=1, GRAMMAR_SENTENCE_CONTROL=2, VOCABULARY_WORD_CHOICE=2, MECHANICS=1, EXPRESSION_DESCRIPTION_VOICE=1.

      2. The Day I Was Late
      Composition: I wake up and saw the clock. It was already seven fifteen! I jump from bed and wear my uniform very fast, my books was still on the table. I did not eat breakfast because no time. My father already left for work so I run to the bus stop. When I reach there, the school bus was turning away. I wave my hands but the driver never see me. I felt worried and call Mum. She was upset but she take me to school in a taxi. There was a traffic jam and many car move slowly. I kept looking at my watch again and again. At last I arrived when the class was reading. Everyone look at me when I entered. I told teacher my alarm did not ring. She tell me check it before sleeping. That night I set two alarms and pack my bag early. I do not want to late again.
      Calibrated bands: TASK_IDEAS=2, ORGANISATION_COHESION=2, GRAMMAR_SENTENCE_CONTROL=2, VOCABULARY_WORD_CHOICE=2, MECHANICS=2, EXPRESSION_DESCRIPTION_VOICE=2.

      3. An Unexpected Kindness
      Composition: The afternoon bus was crowded, and I was tired after basketball practice. When a seat became empty, I hurried towards it. At the same moment, an elderly man carrying two grocery bags reached for the handrail beside me. I pretended not to notice him and sat down. At the next stop, the bus jerked suddenly. One of his bags tore, sending oranges rolling along the floor. Shame warmed my face. Before I could move, several passengers bent down to help. I quickly gathered the last two oranges and offered the man my seat. Instead of scolding me, he smiled and thanked me. We began talking. He told me that he was bringing fruit to his wife in hospital. When he left, he gave me one orange, saying that kindness should always be passed on. I did not feel that I deserved it, but I accepted it politely. The orange remained in my bag all evening, reminding me that a small selfish choice could be corrected by a better one.
      Calibrated bands: TASK_IDEAS=4, ORGANISATION_COHESION=4, GRAMMAR_SENTENCE_CONTROL=4, VOCABULARY_WORD_CHOICE=4, MECHANICS=4, EXPRESSION_DESCRIPTION_VOICE=5.

      4. The Missing Wallet
      Composition: A brown wallet lay beneath the bench at the playground. I picked it up and found several fifty-dollar notes inside. For one exciting moment, I imagined buying the remote-controlled car displayed at the toy shop. Nobody seemed to be watching. Then I noticed a photograph tucked behind the notes. It showed an old woman smiling beside two children. A library card bore her name and address. My friend Hakim suggested taking the wallet to the police post, but it would close soon. Since the address was only three blocks away, our parents agreed to accompany us there. An anxious woman opened the door before we could knock twice. Her expression changed from worry to relief when she saw the wallet. She explained that the money was meant for her medical appointment. She tried to reward us, but we refused. Instead, she gave us cold drinks and called our parents to praise us. As I walked home, the toy car no longer seemed important. Returning the wallet had given me something money could not buy: the quiet satisfaction of knowing that I had made the honest choice when nobody was watching.
      Calibrated bands: TASK_IDEAS=5, ORGANISATION_COHESION=5, GRAMMAR_SENTENCE_CONTROL=4, VOCABULARY_WORD_CHOICE=4, MECHANICS=5, EXPRESSION_DESCRIPTION_VOICE=5.
