spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/sllp_main_db
    username: ${DB_USERNAME:sllp_runtime}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
