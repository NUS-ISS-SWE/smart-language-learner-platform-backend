apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: sllp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"