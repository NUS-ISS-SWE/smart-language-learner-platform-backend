server:
  port: 8080

spring:
  application:
    name: sllp-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
#              - "http://127.0.0.1:*"
              - "http://*.docker.internal:*"
#              - "http://*.local:*"
              - "https://nusmtechswe.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

sllp:
  product-guide-service: ${PRODUCT_GUIDE_SERVICE_URL:http://localhost:8087}
  user-service: http://localhost:8082
  composition-service: http://localhost:8083
  document-service: http://localhost:8089
  subscription-service: http://localhost:8084
  admin-service: http://localhost:8086
  audit:
    ingest-secret: ${AUDIT_INGEST_SECRET:}
  security:
    jwt:
      issuer: nus-iss-smart-language-learner-platform
      secret: ${JWT_SECRET:sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      expirationTimeMillis: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
