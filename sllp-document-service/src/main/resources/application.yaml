server:
  port: 8089
  servlet:
    context-path: /

spring:
  application:
    name: sllp-document-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  liquibase:
    enabled: false  # Schema managed by sllp-liquibase-service; disable here to avoid re-running

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:sllp-uploads-dev}
    region: ${AWS_REGION:ap-southeast-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:}

application:
  jwt:
    secret: ${JWT_SECRET:sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
  file:
    max-size: 52428800
    allowed-types: pdf,docx,pptx,txt
