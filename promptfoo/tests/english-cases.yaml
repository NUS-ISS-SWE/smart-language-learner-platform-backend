      4. The Stray Kitten
      Composition: I heard a soft cry near the stairs after school. A tiny grey kitten was hiding behind a flowerpot. It looked wet and hungry. I wanted to take it home, but I knew its owner might be looking for it. My father helped me dry the kitten with a towel. We made a sign and put it near the lift. That evening, a girl from the next block knocked on our door. She hugged the kitten and thanked us. I was glad that we had helped them find each other.
