server:
  port: 8089
  servlet:
    context-path: /

spring:
  application:
    name: sllp-document-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    time-zone: UTC
  liquibase:
    enabled: false  # Schema managed by sllp-liquibase-service; disable here to avoid re-running
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:sllp-uploads-dev}
    region: ${AWS_REGION:ap-southeast-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:}

sllp:
  audit:
    ingest-url: ${AUDIT_INGEST_URL:http://localhost:8086/internal/audit-events}
    ingest-secret: ${AUDIT_INGEST_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

application:
  jwt:
    secret: ${JWT_SECRET:sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
  file:
    max-size: 52428800
    allowed-types: pdf,docx,pptx,txt
  malware-scan:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:30000}
