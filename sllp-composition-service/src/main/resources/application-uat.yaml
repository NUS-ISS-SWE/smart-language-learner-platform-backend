spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/sllp_main_db
    username: ${DB_USERNAME:sllp_runtime}
    # Matches the local runtime-role default used by Liquibase.  Production
    # deployments should explicitly provide DB_PASSWORD.
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

sllp:
  kafka:
    bootstrap-servers: kafka-service:9092
