apiVersion: v1
kind: ServiceAccount
metadata:
  name: sllp-api-gateway
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sllp-api-gateway-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/jwt"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.security.jwt.secret"
      - objectName: "sllp/audit-ingest"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.audit.ingest-secret"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sllp-api-gateway-config
  namespace: sllp
data:
  SPRING_PROFILES_ACTIVE: "prd"
  SERVER_PORT: "8080"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  SLLP_SUBSCRIPTION_SERVICE: "http://subscription-service:8084"
  LEARNING_SERVICE_URL: "http://learning-service:8095"
  TZ: "UTC"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sllp-api-gateway
  namespace: sllp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sllp-api-gateway
  template:
    metadata:
      labels:
        app: sllp-api-gateway
    spec:
      serviceAccountName: sllp-api-gateway
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-api-gateway
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-api-gateway
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: sllp-api-gateway
          image: 961125mingwei/sllp-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sllp-api-gateway-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sllp-api-gateway-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sllp
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
spec:
  selector:
    app: sllp-api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sllp-api-gateway
  namespace: sllp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sllp-api-gateway
