services:
  postgres-db:
    image: postgres:18
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: sllp_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - sllp-data:/var/lib/postgresql
    networks:
      - sllp-network

  liquibase-service:
    build:
      context: ./sllp-liquibase-service
      dockerfile: Dockerfile
    image: 961125mingwei/sllp-liquibase-service:v1
    container_name: liquibase-service
    environment:
      POSTGRES_DB: sllp_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      SPRING_PROFILES_ACTIVE: uat
    depends_on:
      - postgres-db
    ports:
      - "8081:8081"
    networks:
      - sllp-network

  kafka-service:
    image: apache/kafka:4.2.0
    container_name: kafka-service
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-service:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
#      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:29092,PLAINTEXT_HOST://localhost:9092
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - sllp-network

  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - sllp-network

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: ollama-model-pull
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-service:11434
    command: ["pull", "qwen3:0.6b"]
    depends_on:
      ollama-service:
        condition: service_healthy
    networks:
      - sllp-network

  user-service:
    build:
      context: ./sllp-user-service
      dockerfile: Dockerfile
    image: 961125mingwei/sllp-user-service:v1
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - sllp-network
    depends_on:
      - liquibase-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat

  composition-service:
    build:
      context: ./sllp-composition-service
      dockerfile: Dockerfile
    image: 961125mingwei/sllp-composition-service:v1
    container_name: composition-service
    ports:
      - "8083:8083"
    networks:
      - sllp-network
    depends_on:
      - user-service
      - kafka-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat

  evaluation-service:
    build:
      context: ./sllp-evaluation-service
      dockerfile: Dockerfile
    image: 961125mingwei/sllp-evaluation-service:v1
    container_name: evaluation-service
    ports:
      - "8085:8085"
    networks:
      - sllp-network
    depends_on:
      user-service:
        condition: service_started
      kafka-service:
        condition: service_started
      composition-service:
        condition: service_started
      ollama-model-pull:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat

  api-gateway:
    build:
      context: ./sllp-api-gateway
      dockerfile: Dockerfile
    image: sllp-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - sllp-network
    depends_on:
      - liquibase-service
      - user-service
      - composition-service
      - evaluation-service
      - document-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat

  document-service:
    build:
      context: ./sllp-document-service
      dockerfile: Dockerfile
    image: sllp-document-service:latest
    container_name: document-service
    ports:
      - "8089:8089"
    networks:
      - sllp-network
    depends_on:
      - liquibase-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - DB_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/sllp_main_db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production-min-32-chars}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-sllp-uploads-dev}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: 961125mingwei/sllp-frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - sllp-network
    depends_on:
      - api-gateway

networks:
  sllp-network:
    driver: bridge

volumes:
  sllp-data:
  ollama-data:
