- description: "en-strong — Strong English essay"
  vars:
    caseId: en-strong
    kind: normal
    title: "The Day I Learned to Be Patient"
    language: ENGLISH
    difficultyLevel: BEGINNER
    criteria: "[\"TASK_IDEAS\", \"ORGANISATION_COHESION\", \"GRAMMAR_SENTENCE_CONTROL\", \"VOCABULARY_WORD_CHOICE\", \"MECHANICS\", \"EXPRESSION_DESCRIPTION_VOICE\"]"
    forbiddenCriteria: "[]"
    forbiddenExcerpts: "[]"
    mustFlagWeakness: "[]"
    minStrengthShare: 0.7
    rubric: |-
      [
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "TASK_IDEAS",
          "criterionDescription": "Assess whether the student responds to the topic with a simple, relevant and understandable sequence of ideas. For Primary 1–2, reward clarity and completeness rather than sophisticated development.",
          "weightPercentage": 25
        },
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "ORGANISATION_COHESION",
          "criterionDescription": "Assess whether events and ideas are arranged in a basic logical order with a recognisable beginning, middle and ending. Simple connecting words are sufficient at this level.",
          "weightPercentage": 20
        },
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "GRAMMAR_SENTENCE_CONTROL",
          "criterionDescription": "Assess whether the student can write understandable and mostly complete simple sentences. Consider whether grammar errors affect meaning rather than only counting errors.",
          "weightPercentage": 20
        },
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "VOCABULARY_WORD_CHOICE",
          "criterionDescription": "Assess whether the student uses familiar and age-appropriate words accurately to communicate actions, people, places and feelings.",
          "weightPercentage": 15
        },
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "MECHANICS",
          "criterionDescription": "Assess basic spelling, capitalisation and sentence-ending punctuation. Minor mistakes should not be heavily penalised when meaning remains clear.",
          "weightPercentage": 10
        },
        {
          "language": "ENGLISH",
          "difficultyLevel": "BEGINNER",
          "criterionName": "EXPRESSION_DESCRIPTION_VOICE",
          "criterionDescription": "Assess whether the student includes simple actions, feelings or descriptive details that make the composition clearer and more interesting.",
          "weightPercentage": 10
        }
      ]
    content: |-
      Last spring, my grandfather taught me how to plant a vegetable garden. At first, I thought it would be boring, because nothing seemed to happen for days after we put the seeds into the soil.

      Every morning I ran outside, hoping to see something green, and every morning I came back disappointed. My grandfather only smiled and told me that good things grow slowly. He showed me how to water the beds gently and how to pull out weeds without hurting the young roots.

      After two weeks, tiny shoots finally appeared. I was so excited that I counted them twice. By the end of summer, we picked tomatoes, beans and cucumbers, and my mother cooked a delicious soup with them.

      That garden taught me more than how to grow vegetables. It taught me that patience is not just waiting; it is caring for something every day, even when you cannot see any results yet.

