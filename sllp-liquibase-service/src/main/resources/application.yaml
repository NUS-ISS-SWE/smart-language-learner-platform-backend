server:
  port: 8081

spring:
  application:
    name: sllp-liquibase-service
  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yml
    parameters:
      audit_runtime_password: ${AUDIT_DB_PASSWORD}
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
