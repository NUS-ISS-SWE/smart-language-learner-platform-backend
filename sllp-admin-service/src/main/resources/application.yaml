server:
  port: 8086

spring:
  application:
    name: sllp-admin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  jackson:
    default-property-inclusion: non_null
