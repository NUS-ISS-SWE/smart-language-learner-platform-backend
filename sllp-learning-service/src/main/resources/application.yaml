server:
  port: 8095

spring:
  application:
    name: sllp-learning-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sllp_main_db}
    username: ${DB_USERNAME:sllp_runtime}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

sllp:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    group-id: sllp-learning-service
    topics:
      composition-grading-completed: ${SLLP_COMPOSITION_GRADING_COMPLETED_TOPIC:SLLP_COMPOSITION_GRADING_COMPLETED_TOPIC}
