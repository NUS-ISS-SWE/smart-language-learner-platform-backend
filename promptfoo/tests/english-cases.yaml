    anchors: |-
      1. A Misunderstanding Between Friends
      Composition: Nadia was my best friend since Primary Three. One week she suddenly stop sitting with me at recess. When I message her, she only answer with one word. I did not know why. I remember I got higher marks for mathematics, so I think maybe she was jealous. I told two classmates about it. They told another person and soon many people know. Nadia came to find me outside the library. She ask why I said those things. I said because she was avoiding me. Then she told me her grandmother was in hospital. Her family went there every day and she was very worried. It was not about my marks at all. I felt bad, but I also told her she should explain earlier. She became angry and walked away. Now we had another problem. We did not talk for one week. It was bad because we were in the same project group. We pass papers to each other but never really speak. Our teacher noticed it and ask what happened. I did not want to explain because it was embarrassing. After class, I wrote Nadia a note. I said sorry for guessing and telling other people. She read the note and said she forgive me, but she was still quiet. I shared lesson notes when she visit the hospital. After some days we started talking more. We became friends again, but not immediately. I learned I should ask my friend what is wrong. I should not make my own story and spread it because a misunderstanding can become bigger very fast.
      Calibrated bands: TASK_IDEAS=2, ORGANISATION_COHESION=2, GRAMMAR_SENTENCE_CONTROL=2, VOCABULARY_WORD_CHOICE=3, MECHANICS=2, EXPRESSION_DESCRIPTION_VOICE=2.

      2. The Competition That Changed Me
      Composition: When my teacher selected me for the inter-school speaking competition, I accepted immediately. I imagined standing beneath the stage lights while the audience applauded. Since I usually spoke confidently in class, I assumed that little preparation was needed. My attitude changed during the first rehearsal. I forgot an entire paragraph, rushed through my examples and stared at the floor. My teacher advised me to practise in front of others, but embarrassment made me avoid every opportunity. I kept rewriting the speech instead, hoping that better words would solve the problem. A week before the competition, my younger brother found me practising alone. He sat on my bed and listened. Each time I stumbled, he waited without laughing. Gradually, I invited my parents and then two classmates to become my audience. Their comments helped me slow down and make eye contact. On competition day, my hands still trembled. Halfway through the speech, I lost my place. Rather than freezing, I paused, took a breath and continued in my own words. I did not win, but I completed the speech clearly and received a commendation. At first, the result disappointed me because I had hoped to bring a trophy back to school. Later, I realised the competition had exposed both my overconfidence and my fear of failure. Careful practice had not guaranteed a prize, but it had taught me to accept criticism and recover from mistakes. I also understood that confidence comes from repeated effort, not simply from believing that I am talented. Those lessons mattered beyond one afternoon on a stage.
      Calibrated bands: TASK_IDEAS=3, ORGANISATION_COHESION=3, GRAMMAR_SENTENCE_CONTROL=3, VOCABULARY_WORD_CHOICE=3, MECHANICS=4, EXPRESSION_DESCRIPTION_VOICE=3.

      3. The Night of the Power Cut
      Composition: The ceiling fan slowed to a stop, and every light in our flat vanished at once. For a few seconds, the darkness seemed complete. Then phones began glowing in neighbouring windows, and surprised voices drifted along the corridor. My first thought was the history presentation stored on my computer. I had postponed saving a backup, and the blank screen now reflected my anxious face. While I complained, my grandmother calmly found a torch and suggested checking on Mr Lim, our elderly neighbour. He lived alone and depended on an electric mobility aid. We discovered him near his doorway, trying to reach a drawer where he kept spare batteries. My brother held the torch while I retrieved them. Other neighbours soon emerged. One family brought candles, another shared a battery-powered fan, and someone called the electricity provider. With the lifts unavailable, two adults climbed twelve floors to deliver medicine to a resident who had just returned from hospital. The corridor, usually a place of hurried greetings, became a gathering point. Children told stories while adults exchanged food that might spoil in warm refrigerators. Even Mr Lim began joking about our unexpected candlelight party. Power returned two hours later. Cheers broke out, followed by the familiar hum of appliances. I was relieved to discover that my presentation had survived, yet it no longer seemed like the evening’s greatest concern. The blackout had interrupted our routines, but it also illuminated a community hidden behind closed doors. Before going to bed, I saved my work twice and wrote down the names of neighbours I had finally come to know.
      Calibrated bands: TASK_IDEAS=4, ORGANISATION_COHESION=4, GRAMMAR_SENTENCE_CONTROL=4, VOCABULARY_WORD_CHOICE=4, MECHANICS=5, EXPRESSION_DESCRIPTION_VOICE=4.

      4. The Phone on the Bus
      Composition: The phone slid across the bus floor as the vehicle turned sharply. I trapped it beneath my shoe before it disappeared under a seat. Its case was cracked, but the screen lit up with a photograph of a laughing family and twelve missed calls from “Mum”. The owner had clearly left in a hurry. My stop was approaching, and I was expected at a team rehearsal. Handing the phone to the driver would have been simple, yet an uneasy thought stopped me: what if the owner returned to the interchange and could not trace which bus held it? I answered the next call. A breathless woman explained that the phone belonged to her son, who had alighted two stops earlier on his way to an examination. We agreed to meet at the interchange. I messaged my teammates, got off several stops beyond my destination and boarded a bus travelling back. By the time I arrived, rehearsal had begun. A boy in school uniform stood beside his mother, repeatedly checking the road. Relief transformed his face when I raised the phone. He thanked me, then admitted that his examination entry details were stored on it. His mother offered to pay for my taxi, but I declined and hurried to rehearsal. My teammates were annoyed by my late arrival. Once I explained, however, our captain quietly shifted the schedule so that I could join the final run. I had expected honesty to feel effortless and immediately rewarding. Instead, returning the phone cost time and inconvenienced others. That was precisely why the decision stayed with me. Doing the right thing is meaningful not when it is convenient, but when there is a genuine reason to walk away.
      Calibrated bands: TASK_IDEAS=5, ORGANISATION_COHESION=5, GRAMMAR_SENTENCE_CONTROL=5, VOCABULARY_WORD_CHOICE=4, MECHANICS=5, EXPRESSION_DESCRIPTION_VOICE=5.
