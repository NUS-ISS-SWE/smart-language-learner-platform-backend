apiVersion: v1
kind: ServiceAccount
metadata:
  name: sllp-user-service
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sllp-user-service-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/postgres"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "spring.datasource.username"
          - path: "password"
            objectAlias: "spring.datasource.password"
      - objectName: "sllp/jwt"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "application.jwt.secret"
          - path: "secret"
            objectAlias: "sllp.security.jwt.secret"
      - objectName: "sllp/audit-ingest"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.audit.ingest-secret"
      - objectName: "sllp/mail"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "spring.mail.username"
          - path: "password"
            objectAlias: "spring.mail.password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sllp-user-service-config
  namespace: sllp
data:
  SPRING_PROFILES_ACTIVE: "prd"
  SERVER_PORT: "8082"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/sllp_main_db"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  AUDIT_INGEST_URL: "http://admin-service:8086/internal/audit-events"
  API_BASE_URL: "https://www.nusmtechswe.com"
  FRONTEND_BASE_URL: "https://www.nusmtechswe.com"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  JWT_ISSUER: "sllp-app"
  TZ: "UTC"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sllp-user-service
  namespace: sllp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sllp-user-service
  template:
    metadata:
      labels:
        app: sllp-user-service
    spec:
      serviceAccountName: sllp-user-service
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-user-service
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-user-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: sllp-user-service
          image: 961125mingwei/sllp-user-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sllp-user-service-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sllp-user-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sllp
spec:
  selector:
    app: sllp-user-service
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sllp-user-service
  namespace: sllp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sllp-user-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sllp-user-service
  namespace: sllp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sllp-user-service
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 256Mi
