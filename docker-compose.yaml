#      - SPRING_PROFILES_ACTIVE=uat

  orchestrator-service:
    build:
      context: .
      dockerfile: sllp-orchestrator-service/Dockerfile
    image: sllp-orchestrator-service:latest
    container_name: orchestrator-service
    ports:
      - "8090:8090"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      kafka-service:
        condition: service_started
      composition-service:
        condition: service_started
    environment:
      ORCHESTRATOR_DATABASE_URL: postgresql+psycopg://sllp_runtime:${AUDIT_DB_PASSWORD:-password}@postgres-db:5432/sllp_main_db
      KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092
      KAFKA_GROUP_ID: sllp-orchestrator-group
      KAFKA_GRADING_REQUESTED_TOPIC: SLLP_COMPOSITION_GRADING_REQUESTED_TOPIC
      KAFKA_GRADING_COMPLETED_TOPIC: SLLP_COMPOSITION_GRADING_COMPLETED_TOPIC
      KAFKA_GRADING_PROGRESS_TOPIC: SLLP_COMPOSITION_GRADING_PROGRESS_TOPIC
      AGENT_PROVIDER: ${AGENT_PROVIDER:-a2a}
      EVIDENCE_AGENT_CARD_URL: ${EVIDENCE_AGENT_CARD_URL:-http://evidence-agent:8092/.well-known/agent-card.json}
      GRADING_AGENT_CARD_URL: ${GRADING_AGENT_CARD_URL:-http://grading-agent:8093/.well-known/agent-card.json}
      REVIEW_AGENT_CARD_URL: ${REVIEW_AGENT_CARD_URL:-http://review-agent:8094/.well-known/agent-card.json}
      SUGGESTION_AGENT_CARD_URL: ${SUGGESTION_AGENT_CARD_URL:-http://suggestions-agent:8091/.well-known/agent-card.json}
      EVIDENCE_AGENT_TOKEN: ${EVIDENCE_AGENT_TOKEN:-}
      GRADING_AGENT_TOKEN: ${GRADING_AGENT_TOKEN:-}
      REVIEW_AGENT_TOKEN: ${REVIEW_AGENT_TOKEN:-}
      SUGGESTION_AGENT_TOKEN: ${SUGGESTION_AGENT_TOKEN:-}
      AGENT_HTTP_TIMEOUT_SECONDS: ${AGENT_HTTP_TIMEOUT_SECONDS:-60}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AUDIT_INGEST_URL: http://admin-service:8086/internal/audit-events
      AUDIT_INGEST_SECRET: ${AUDIT_INGEST_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  evidence-agent:
    build:
      context: .
      dockerfile: sllp-evidence-service/Dockerfile
    image: sllp-evidence-agent:latest
    networks: [sllp-network]
    expose: ["8092"]
    depends_on:
      user-service: {condition: service_started}
      admin-service: {condition: service_started}
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required for A2A agents}
      - EVIDENCE_PUBLIC_BASE_URL=http://evidence-agent:8092
      - EVIDENCE_AGENT_TOKEN=${EVIDENCE_AGENT_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grading-agent:
    build:
      context: .
      dockerfile: sllp-evaluation-service/Dockerfile
    image: sllp-grading-agent:latest
    networks: [sllp-network]
    expose: ["8093"]
    depends_on:
      user-service: {condition: service_started}
      admin-service: {condition: service_started}
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required for A2A agents}
      - GRADING_PUBLIC_BASE_URL=http://grading-agent:8093
      - GRADING_AGENT_TOKEN=${GRADING_AGENT_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  review-agent:
    build:
      context: .
      dockerfile: sllp-review-service/Dockerfile
    image: sllp-review-agent:latest
    networks: [sllp-network]
    expose: ["8094"]
    depends_on:
      user-service: {condition: service_started}
      admin-service: {condition: service_started}
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required for A2A agents}
      - REVIEW_PUBLIC_BASE_URL=http://review-agent:8094
      - REVIEW_AGENT_TOKEN=${REVIEW_AGENT_TOKEN:-}
      - REVIEW_AUTO_APPROVE=${REVIEW_AUTO_APPROVE:-false}
      - REVIEW_USER_SERVICE_URL=http://user-service:8082
      - REVIEW_ADMIN_SERVICE_URL=http://admin-service:8086
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  suggestions-agent:
    build:
      context: .
      dockerfile: sllp-suggestions-agent/Dockerfile
    image: sllp-suggestions-agent:latest
    container_name: suggestions-agent
    expose:
      - "8091"
    networks:
      - sllp-network
    environment:
      - SUGGESTIONS_PUBLIC_BASE_URL=http://suggestions-agent:8091
      - SUGGESTIONS_USER_SERVICE_URL=http://user-service:8082
      - SUGGESTIONS_ADMIN_SERVICE_URL=http://admin-service:8086
      - SUGGESTIONS_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUGGESTIONS_OPENAI_MODEL=${SUGGESTIONS_OPENAI_MODEL:-gpt-4o-mini}
      - SUGGESTION_AGENT_TOKEN=${SUGGESTION_AGENT_TOKEN:-}
    depends_on:
      user-service:
        condition: service_started
      admin-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - sllp-network
    depends_on:
      orchestrator-service:
        condition: service_started

  admin-service:
    build:
      context: .
      dockerfile: sllp-admin-service/Dockerfile
    image: sllp-admin-service:latest
    container_name: admin-service
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - DB_USERNAME=sllp_runtime
      - DB_PASSWORD=${AUDIT_DB_PASSWORD:-password}
      - AUDIT_INGEST_URL=http://admin-service:8086/internal/audit-events
      - AUDIT_INGEST_SECRET=${AUDIT_INGEST_SECRET:-}
      - TZ=UTC

  api-gateway:
    build:
      context: .
      dockerfile: sllp-api-gateway/Dockerfile
    image: sllp-api-gateway:latest
    container_name: api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      composition-service:
        condition: service_started
#      product-guide-service:
#        condition: service_started
#      evaluation-service:
#        condition: service_started
      orchestrator-service:
        condition: service_started
#      document-service:
#        condition: service_started
      subscription-service:
        condition: service_started
      admin-service:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - JWT_SECRET=${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      - AUDIT_INGEST_SECRET=${AUDIT_INGEST_SECRET:-}

  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    ports:
      - "3310:3310"
    networks:
      - sllp-network

  document-service:
    build:
      context: .
      dockerfile: sllp-document-service/Dockerfile
    image: sllp-document-service:latest
    container_name: document-service
    ports:
      - "8089:8089"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uat
      DB_USERNAME: sllp_runtime
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/sllp_main_db
      JWT_SECRET: ${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      # Native AWS S3: do not set AWS_S3_ENDPOINT for AWS; it is only for an
      # explicitly supported S3-compatible endpoint and is blank by default.
      # The document service validates that a bucket is configured at startup.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-}
      AUDIT_INGEST_URL: http://admin-service:8086/internal/audit-events
      AUDIT_INGEST_SECRET: ${AUDIT_INGEST_SECRET:-}

  subscription-service:
    build:
      context: .
      dockerfile: sllp-subscription-service/Dockerfile
    image: 961125mingwei/sllp-subscription-service:v3
    container_name: subscription-service
    ports:
      - "8084:8084"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PAYMENT_LINK_BASIC=${STRIPE_PAYMENT_LINK_BASIC:-}
      - STRIPE_PAYMENT_LINK_PREMIUM=${STRIPE_PAYMENT_LINK_PREMIUM:-}
      - DB_USERNAME=sllp_runtime
      - DB_PASSWORD=${AUDIT_DB_PASSWORD:-password}
      - AUDIT_INGEST_URL=http://admin-service:8086/internal/audit-events
      - AUDIT_INGEST_SECRET=${AUDIT_INGEST_SECRET:-}

networks:
  sllp-network:
    driver: bridge

volumes:
  sllp-data:
  # minio-data:
#  ollama-data:
