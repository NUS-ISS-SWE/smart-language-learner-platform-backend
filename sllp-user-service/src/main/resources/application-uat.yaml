spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/sllp_main_db
    username: ${DB_USERNAME:sllp_runtime}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

app:
  api-base-url: ${API_BASE_URL:https://www.nusmtechswe.com}
  frontend-base-url: ${FRONTEND_BASE_URL:https://www.nusmtechswe.com}
