apiVersion: v1
kind: ServiceAccount
metadata:
  name: sllp-document-service
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sllp-document-service-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/postgres"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "spring.datasource.username"
          - path: "password"
            objectAlias: "spring.datasource.password"
      - objectName: "sllp/jwt"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "application.jwt.secret"
      - objectName: "sllp/audit-ingest"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.audit.ingest-secret"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sllp-document-service-config
  namespace: sllp
data:
  SPRING_PROFILES_ACTIVE: "prd"
  SERVER_PORT: "8089"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/sllp_main_db"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  AWS_S3_BUCKET: "sllp-uploads-697982515707-ap-southeast-1"
  AWS_REGION: "ap-southeast-1"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  AUDIT_INGEST_URL: "http://admin-service:8086/internal/audit-events"
  TZ: "UTC"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sllp-document-service
  namespace: sllp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sllp-document-service
  template:
    metadata:
      labels:
        app: sllp-document-service
    spec:
      serviceAccountName: sllp-document-service
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: sllp-document-service
          image: 961125mingwei/sllp-document-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sllp-document-service-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sllp-document-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: sllp
spec:
  selector:
    app: sllp-document-service
  ports:
    - name: http
      protocol: TCP
      port: 8089
      targetPort: http
  type: ClusterIP
