[project]
name = "sllp-orchestrator-service"
version = "0.1.0"
description = "LangGraph workflow orchestrator for SLLP composition assessments"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=0.2,<1.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "prometheus-client>=0.21,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
