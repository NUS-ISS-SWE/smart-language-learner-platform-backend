  user-service:
    build:
      context: .
      dockerfile: sllp-user-service/Dockerfile
    image: 961125mingwei/sllp-user-service:v3
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - JWT_SECRET=${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - DB_USERNAME=sllp_runtime
      - DB_PASSWORD=${AUDIT_DB_PASSWORD:-password}
      - AUDIT_INGEST_URL=http://admin-service:8086/internal/audit-events
      - AUDIT_INGEST_SECRET=${AUDIT_INGEST_SECRET:-}

  composition-service:
    build:
      context: .
      dockerfile: sllp-composition-service/Dockerfile
    image: 961125mingwei/sllp-composition-service:v3
    container_name: composition-service
    ports:
      - "8083:8083"
    networks:
      - sllp-network
    depends_on:
      - user-service
      - kafka-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      # Keep the composition service's database credentials in sync with the
      # runtime role provisioned by the Liquibase service.
      - DB_USERNAME=sllp_runtime
      - DB_PASSWORD=${AUDIT_DB_PASSWORD:-password}
      - AUDIT_INGEST_URL=http://admin-service:8086/internal/audit-events
      - AUDIT_INGEST_SECRET=${AUDIT_INGEST_SECRET:-}

