apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sllp-kafka-ebs-gp3
provisioner: ebs.csi.eks.amazonaws.com
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: sllp-kafka-ebs-gp3
        size: 10Gi
        deleteClaim: true
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: sllp-kafka
  namespace: sllp
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: composition-grading-requested
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  topicName: SLLP_COMPOSITION_GRADING_REQUESTED_TOPIC
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: composition-grading-completed
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  topicName: SLLP_COMPOSITION_GRADING_COMPLETED_TOPIC
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: composition-grading-progress
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  topicName: SLLP_COMPOSITION_GRADING_PROGRESS_TOPIC
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: composition-generation-requested
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  topicName: SLLP_COMPOSITION_GENERATION_REQUESTED_TOPIC
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: composition-generation-completed
  namespace: sllp
  labels:
    strimzi.io/cluster: sllp-kafka
spec:
  topicName: SLLP_COMPOSITION_GENERATION_COMPLETED_TOPIC
  partitions: 1
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: sllp
spec:
  type: ExternalName
  externalName: sllp-kafka-kafka-bootstrap.sllp.svc.cluster.local
  ports:
    - name: kafka
      port: 9092
      protocol: TCP
      targetPort: 9092
