- description: INTERMEDIATE - Our Class Garden
  vars:
    title: Our Class Garden
    language: ENGLISH
    difficultyLevel: INTERMEDIATE
    difficultyStandard: Singapore Primary 3 to 4
    evidence: No evidence supplied; inspect the composition directly.
    content: |-
      Our teacher gave the class an empty patch of soil behind the canteen. She challenged us to turn it into a garden before Open House. At first, we argued about what to plant. Some classmates wanted flowers, while others wanted vegetables. We finally divided the patch into two sections and formed teams.

      My team planted tomato seeds. Every morning, two pupils watered them and pulled out weeds. For many days, nothing appeared. We wondered if we had done something wrong. Then, after a rainy weekend, tiny green shoots pushed through the soil. We cheered as if we had won a prize.

      By Open House, yellow flowers and red tomatoes filled our section. The other team had grown bright sunflowers. Our garden was not perfectly neat, but every pupil had helped. When our parents visited, we proudly explained how patience and teamwork had changed an empty patch into a lively place.
    rubric: |-
      - TASK_IDEAS (25%): Assess whether the student addresses the topic clearly and develops the main events with relevant supporting details, explanations and reactions appropriate for Primary 3–4.
      - ORGANISATION_COHESION (20%): Assess whether the composition has a clear beginning, development and ending, with logical paragraphing and suitable transitions between events and ideas.
      - GRAMMAR_SENTENCE_CONTROL (20%): Assess control of simple and compound sentences, tense consistency, subject-verb agreement and attempts at more varied sentence structures.
      - VOCABULARY_WORD_CHOICE (15%): Assess whether vocabulary is accurate, reasonably varied and appropriate to the context, with limited unnecessary repetition.
      - MECHANICS (10%): Assess spelling, punctuation, capitalisation and paragraph formatting. Errors should be considered according to their frequency and impact on readability.
      - EXPRESSION_DESCRIPTION_VOICE (10%): Assess the use of description, dialogue, actions and emotional detail to develop events and engage the reader.
    bandDescriptors: |-
