server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: sllp-user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_user_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

application:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000