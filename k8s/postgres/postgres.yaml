apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sllp-auto-ebs-gp3
provisioner: ebs.csi.eks.amazonaws.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-db
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-db-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/postgres"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-db-init
  namespace: sllp
data:
  10-enable-replication.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    cat >> "${PGDATA}/pg_hba.conf" <<'EOF'
    host replication postgres 0.0.0.0/0 scram-sha-256
    host replication postgres ::/0 scram-sha-256
    EOF
---
# StatefulSet peer discovery and streaming-replication endpoint.
apiVersion: v1
kind: Service
metadata:
  name: postgres-db-headless
  namespace: sllp
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Existing applications use this service. It always targets the writable primary.
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: sllp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-db
    statefulset.kubernetes.io/pod-name: postgres-db-0
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Optional read-only endpoint for demonstrating reads from the standby.
apiVersion: v1
kind: Service
metadata:
  name: postgres-db-replica
  namespace: sllp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-db
    statefulset.kubernetes.io/pod-name: postgres-db-1
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-db
  namespace: sllp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: sllp
spec:
  serviceName: postgres-db-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-db
    spec:
      serviceAccountName: postgres-db
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-db
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ceu
            - |
              ordinal="${HOSTNAME##*-}"

              if [[ "${ordinal}" != "0" ]]; then
                escaped_password="$(sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' /mnt/secrets-store/password)"
                printf '%s\n' "postgres-db-0.postgres-db-headless:5432:*:postgres:${escaped_password}" > /var/lib/postgresql/.pgpass
                chmod 0600 /var/lib/postgresql/.pgpass

                if [[ ! -s "${PGDATA}/PG_VERSION" ]]; then
                  until pg_isready --host=postgres-db-0.postgres-db-headless --port=5432 --username=postgres --dbname=sllp_main_db; do
                    sleep 2
                  done

                  PGPASSFILE=/var/lib/postgresql/.pgpass pg_basebackup \
                    --host=postgres-db-0.postgres-db-headless \
                    --port=5432 \
                    --username=postgres \
                    --pgdata="${PGDATA}" \
                    --wal-method=stream \
                    --checkpoint=fast \
                    --progress

                  touch "${PGDATA}/standby.signal"
                  cat >> "${PGDATA}/postgresql.auto.conf" <<EOF
              primary_conninfo = 'host=postgres-db-0.postgres-db-headless port=5432 user=postgres passfile=/var/lib/postgresql/.pgpass application_name=${HOSTNAME}'
              EOF
                fi
              fi

              exec /usr/local/bin/docker-entrypoint.sh postgres \
                -c wal_level=replica \
                -c max_wal_senders=10 \
                -c wal_keep_size=512MB \
                -c hot_standby=on \
                -c password_encryption=scram-sha-256
          env:
            - name: POSTGRES_DB
              value: sllp_main_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /mnt/secrets-store/password
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/10-enable-replication.sh
              subPath: 10-enable-replication.sh
              readOnly: true
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --host=127.0.0.1 --port=5432 --username=postgres --dbname=sllp_main_db
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --host=127.0.0.1 --port=5432 --username=postgres --dbname=sllp_main_db
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --host=127.0.0.1 --port=5432 --username=postgres --dbname=sllp_main_db
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-db-init
            defaultMode: 0555
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: postgres-db-secrets
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: sllp-auto-ebs-gp3
        resources:
          requests:
            storage: 20Gi
