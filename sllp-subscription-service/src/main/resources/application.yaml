server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: sllp-subscription-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  jackson:
    default-property-inclusion: non_null

stripe:
  # Signing secret for the webhook endpoint (starts with whsec_). NOT the API secret key —
  # we never call the Stripe API, only verify inbound webhook signatures.
  # Local dev: printed by `stripe listen --forward-to ...`. Prod: from the endpoint
  # created in the Stripe Dashboard, stored as a real secret (e.g. AWS Secrets Manager).
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Static Payment Link URLs configured in the Stripe Dashboard for each paid plan.
  payment-link-basic: ${STRIPE_PAYMENT_LINK_BASIC:}
  payment-link-premium: ${STRIPE_PAYMENT_LINK_PREMIUM:}

sllp:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  audit:
    ingest-url: ${AUDIT_INGEST_URL:http://localhost:8086/internal/audit-events}
    ingest-secret: ${AUDIT_INGEST_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
