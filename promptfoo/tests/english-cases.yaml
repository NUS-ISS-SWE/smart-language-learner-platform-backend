- description: BEGINNER - My Surprise Birthday
  vars:
    title: My Surprise Birthday
    language: ENGLISH
    difficultyLevel: BEGINNER
    difficultyStandard: Singapore Primary 1 to 2
    evidence: No evidence supplied; inspect the composition directly.
    content: >-
      When I reached home, the living room was dark and strangely quiet. I called for Mum, but nobody
      answered. Suddenly, the lights came on. My family and friends jumped out and shouted, “Surprise!”
      Colourful balloons covered the wall, and a chocolate cake waited on the table. I laughed because I had
      thought everyone had forgotten my birthday. We played musical chairs and shared the cake. Before my
      friends left, I opened a small box from my sister. Inside was the storybook I had wanted for weeks. I
      hugged her tightly. It was not the biggest party, but it was my happiest one.
    rubric: |-
