server:
  port: 8087

spring:
  application:
    name: sllp-product-guide-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  ai:
    model:
      chat: openai
      embedding: openai
      moderation: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536
        distance-type: cosine-distance
        index-type: hnsw
        table-name: product_guide_vector_store

sllp:
  audit:
    ingest-url: ${AUDIT_INGEST_URL:http://localhost:8086/internal/audit-events}
    ingest-secret: ${AUDIT_INGEST_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
