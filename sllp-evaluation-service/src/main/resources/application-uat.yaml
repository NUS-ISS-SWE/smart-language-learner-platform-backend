spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/sllp_main_db
    username: ${DB_USERNAME:sllp_runtime}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

sllp:
  public-base-url: ${GRADING_PUBLIC_BASE_URL:http://grading-agent:8093}
  a2a-token: ${GRADING_AGENT_TOKEN:}
  services:
    user-service-url: ${GRADING_USER_SERVICE_URL:http://user-service:8082}
    admin-service-url: ${GRADING_ADMIN_SERVICE_URL:http://admin-service:8086}
