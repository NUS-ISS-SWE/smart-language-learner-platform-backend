server:
  port: 8081

spring:
  application:
    name: sllp-liquibase-service
  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yml
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: sa
    driverClassName: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
