server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: sllp-user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_user_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mwcode5050@gmail.com}
    password: ${MAIL_PASSWORD:vdrfkynnbdayotpp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

application:
  jwt:
    secret: ${JWT_SECRET:sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000

sllp:
  security:
    jwt:
      issuer: ${JWT_ISSUER:sllp-app}
      secret: ${JWT_SECRET:sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      expirationTimeMillis: 86400000

app:
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
