# Local-only overlay automatically loaded by `docker compose`.
# UAT and production must use `docker compose -f docker-compose.yaml ...` so this
# emulator and its test credentials are never included in a deployment.
services:
  localstack:
    image: localstack/localstack:4.12.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      S3_VALIDATE_SIGNATURES: "1"
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api list-buckets >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sllp-network

  document-service:
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_S3_BUCKET: sllp-uploads-local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SESSION_TOKEN: ""
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:4566
