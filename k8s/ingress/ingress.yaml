apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: sllp-alb
spec:
  scheme: internet-facing
  certificateARNs:
    - arn:aws:acm:ap-southeast-1:697982515707:certificate/de0814d6-d4d1-4991-922a-39783bac4a6c
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: sllp-alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: sllp-alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sllp
  namespace: sllp
spec:
  ingressClassName: sllp-alb
  rules:
    - host: nusmtechswe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: www.nusmtechswe.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
