server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: sllp-subscription-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sllp_main_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  jackson:
    default-property-inclusion: non_null

sllp:
  audit:
    ingest-url: ${AUDIT_INGEST_URL:http://localhost:8086/internal/audit-events}
    ingest-secret: ${AUDIT_INGEST_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
