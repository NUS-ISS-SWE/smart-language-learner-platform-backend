apiVersion: v1
kind: ServiceAccount
metadata:
  name: sllp-evidence-service
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sllp-evidence-service-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/openai"
        objectType: "secretsmanager"
        jmesPath:
          - path: "apiKey"
            objectAlias: "spring.ai.openai.api-key"
      - objectName: "sllp/audit-ingest"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.audit.ingest-secret"
      - objectName: "sllp/agent-tokens"
        objectType: "secretsmanager"
        jmesPath:
          - path: "evidence"
            objectAlias: "sllp.a2a-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sllp-evidence-service-config
  namespace: sllp
data:
  SPRING_PROFILES_ACTIVE: "prd"
  SERVER_PORT: "8092"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  EVIDENCE_PUBLIC_BASE_URL: "http://evidence-agent:8092"
  SLLP_SERVICES_COMPOSITION_SERVICE_URL: "http://composition-service:8083"
  SLLP_SERVICES_ADMIN_SERVICE_URL: "http://admin-service:8086"
  SLLP_SERVICES_USER_SERVICE_URL: "http://user-service:8082"
  AUDIT_INGEST_URL: "http://admin-service:8086/internal/audit-events"
  TZ: "UTC"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sllp-evidence-service
  namespace: sllp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sllp-evidence-service
  template:
    metadata:
      labels:
        app: sllp-evidence-service
    spec:
      serviceAccountName: sllp-evidence-service
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: sllp-evidence-service
          image: 961125mingwei/sllp-evidence-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8092
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sllp-evidence-service-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sllp-evidence-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-agent
  namespace: sllp
spec:
  selector:
    app: sllp-evidence-service
  ports:
    - name: http
      protocol: TCP
      port: 8092
      targetPort: http
  type: ClusterIP
