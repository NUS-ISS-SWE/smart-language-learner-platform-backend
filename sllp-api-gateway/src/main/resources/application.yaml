server:
  port: 8080

spring:
  application:
    name: sllp-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
#              - "http://127.0.0.1:*"
              - "http://*.docker.internal:*"
#              - "http://*.local:*"
              - "https://nusmtechswe.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

sllp:
  user-service: http://localhost:8082
  composition-service: http://localhost:8083
  document-service: http://localhost:8089
  security:
    jwt:
      issuer: nus-iss-smart-language-learner-platform
      secret: bnVzLWlzcy1jb2RlY29ubmVjdC1qd3Qtc2VjcmV0LXRva2Vu
      expirationTimeMillis: 86400000
