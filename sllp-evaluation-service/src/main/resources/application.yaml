server:
  port: 8093

spring:
  application:
    name: sllp-evaluation-service
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 0.3
      embedding:
        model: text-embedding-3-small

sllp:
  public-base-url: ${GRADING_PUBLIC_BASE_URL:http://localhost:8093}
  a2a-token: ${GRADING_AGENT_TOKEN:}
  ai-usage:
    provider: OPENAI
    default-model: gpt-4o-mini
    pricing-version: openai-gpt-4o-mini-2026-08
    input-price-micros-per-million: 150000
    cached-input-price-micros-per-million: 75000
    output-price-micros-per-million: 600000
  services:
    user-service-url: http://localhost:8082
    admin-service-url: http://localhost:8086
