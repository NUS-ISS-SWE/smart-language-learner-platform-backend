apiVersion: v1
kind: ServiceAccount
metadata:
  name: sllp-evaluation-service
  namespace: sllp
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sllp-evaluation-service-secrets
  namespace: sllp
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    usePodIdentity: "true"
    objects: |
      - objectName: "sllp/openai"
        objectType: "secretsmanager"
        jmesPath:
          - path: "apiKey"
            objectAlias: "spring.ai.openai.api-key"
      - objectName: "sllp/agent-tokens"
        objectType: "secretsmanager"
        jmesPath:
          - path: "grading"
            objectAlias: "sllp.a2a-token"
      - objectName: "sllp/audit-ingest"
        objectType: "secretsmanager"
        jmesPath:
          - path: "secret"
            objectAlias: "sllp.audit.ingest-secret"
      - objectName: "sllp/postgres"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "spring.datasource.username"
          - path: "password"
            objectAlias: "spring.datasource.password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sllp-evaluation-service-config
  namespace: sllp
data:
  SPRING_PROFILES_ACTIVE: "prd"
  SERVER_PORT: "8093"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/sllp_main_db"
  OPENAI_CHAT_MODEL: "gpt-6-luna"
  GRADING_PUBLIC_BASE_URL: "http://grading-agent:8093"
  GRADING_USER_SERVICE_URL: "http://user-service:8082"
  GRADING_ADMIN_SERVICE_URL: "http://admin-service:8086"
  AUDIT_INGEST_URL: "http://admin-service:8086/internal/audit-events"
  OPENAI_STATUS_URL: "https://status.openai.com/proxy/status.openai.com"
  OPENAI_STATUS_CONNECT_TIMEOUT: "10s"
  OPENAI_STATUS_READ_TIMEOUT: "10s"
  TZ: "UTC"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sllp-evaluation-service
  namespace: sllp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sllp-evaluation-service
  template:
    metadata:
      labels:
        app: sllp-evaluation-service
    spec:
      serviceAccountName: sllp-evaluation-service
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-evaluation-service
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sllp-evaluation-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: sllp-evaluation-service
          image: 961125mingwei/sllp-evaluation-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8093
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sllp-evaluation-service-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sllp-evaluation-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: grading-agent
  namespace: sllp
spec:
  selector:
    app: sllp-evaluation-service
  ports:
    - name: http
      protocol: TCP
      port: 8093
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sllp-evaluation-service
  namespace: sllp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sllp-evaluation-service
