services:
  postgres-db:
    image: pgvector/pgvector:pg18
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: sllp_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - sllp-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sllp_main_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sllp-network

  liquibase-service:
    build:
      context: .
      dockerfile: sllp-liquibase-service/Dockerfile
    image: 961125mingwei/sllp-liquibase-service:v3
    container_name: liquibase-service
    environment:
      POSTGRES_DB: sllp_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      SPRING_PROFILES_ACTIVE: uat
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - sllp-network

  kafka-service:
    image: apache/kafka:4.2.0
    container_name: kafka-service
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-service:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
#      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:29092,PLAINTEXT_HOST://localhost:9092
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - sllp-network

  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - sllp-network

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: ollama-model-pull
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-service:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
    command: ["pull", "${OLLAMA_MODEL:-qwen3:0.6b}"]
    depends_on:
      ollama-service:
        condition: service_healthy
    networks:
      - sllp-network

  user-service:
    build:
      context: .
      dockerfile: sllp-user-service/Dockerfile
    image: 961125mingwei/sllp-user-service:v3
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - JWT_SECRET=${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}

  composition-service:
    build:
      context: .
      dockerfile: sllp-composition-service/Dockerfile
    image: 961125mingwei/sllp-composition-service:v3
    container_name: composition-service
    ports:
      - "8083:8083"
    networks:
      - sllp-network
    depends_on:
      - user-service
      - kafka-service
    environment:
      - SPRING_PROFILES_ACTIVE=uat

  product-guide-service:
    build:
      context: .
      dockerfile: sllp-product-guide-service/Dockerfile
    image: sllp-product-guide-service:latest
    container_name: product-guide-service
    expose:
      - "8087"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - DB_PASSWORD=${DB_PASSWORD:-password}

#  evaluation-service:
#    build:
#      context: .
#      dockerfile: sllp-evaluation-service/Dockerfile
#    image: 961125mingwei/sllp-evaluation-service:v2
#    container_name: evaluation-service
#    ports:
#      - "8085:8085"
#    networks:
#      - sllp-network
#    depends_on:
#      user-service:
#        condition: service_started
#      kafka-service:
#        condition: service_started
#      composition-service:
#        condition: service_started
#    environment:
#      - SPRING_PROFILES_ACTIVE=uat

  orchestrator-service:
    build:
      context: .
      dockerfile: sllp-orchestrator-service/Dockerfile
    image: sllp-orchestrator-service:latest
    container_name: orchestrator-service
    ports:
      - "8090:8090"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      kafka-service:
        condition: service_started
      composition-service:
        condition: service_started
    environment:
      - ORCHESTRATOR_DATABASE_URL=postgresql+psycopg://postgres:password@postgres-db:5432/sllp_main_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka-service:9092
      - KAFKA_GROUP_ID=sllp-orchestrator-group
      - KAFKA_GRADING_REQUESTED_TOPIC=SLLP_COMPOSITION_GRADING_REQUESTED_TOPIC
      - KAFKA_GRADING_COMPLETED_TOPIC=SLLP_COMPOSITION_GRADING_COMPLETED_TOPIC
      - KAFKA_GRADING_PROGRESS_TOPIC=SLLP_COMPOSITION_GRADING_PROGRESS_TOPIC
      - AGENT_PROVIDER=${AGENT_PROVIDER:-placeholder}

  admin-service:
    build:
      context: .
      dockerfile: sllp-admin-service/Dockerfile
    image: sllp-admin-service:latest
    container_name: admin-service
    ports:
      - "8086:8086"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - DB_PASSWORD=password

  api-gateway:
    build:
      context: .
      dockerfile: sllp-api-gateway/Dockerfile
    image: sllp-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      composition-service:
        condition: service_started
      product-guide-service:
        condition: service_started
#      evaluation-service:
#        condition: service_started
      orchestrator-service:
        condition: service_started
      document-service:
        condition: service_started
      subscription-service:
        condition: service_started
      admin-service:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - JWT_SECRET=${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    networks:
      - sllp-network

  document-service:
    build:
      context: .
      dockerfile: sllp-document-service/Dockerfile
    image: sllp-document-service:latest
    container_name: document-service
    ports:
      - "8089:8089"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - DB_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/sllp_main_db
      - JWT_SECRET=${JWT_SECRET:-sllpJwtSecretKeyForSigningAndVerificationNusIss2026LocalDevEnv12}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-sllp-uploads-dev}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-http://minio:9000}
      - AWS_S3_PUBLIC_ENDPOINT=${AWS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}

  subscription-service:
    build:
      context: .
      dockerfile: sllp-subscription-service/Dockerfile
    image: 961125mingwei/sllp-subscription-service:v3
    container_name: subscription-service
    ports:
      - "8084:8084"
    networks:
      - sllp-network
    depends_on:
      liquibase-service:
        condition: service_completed_successfully
    environment:
      - SPRING_PROFILES_ACTIVE=uat
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PAYMENT_LINK_BASIC=${STRIPE_PAYMENT_LINK_BASIC:-}
      - STRIPE_PAYMENT_LINK_PREMIUM=${STRIPE_PAYMENT_LINK_PREMIUM:-}

networks:
  sllp-network:
    driver: bridge

volumes:
  sllp-data:
  minio-data:
  ollama-data:
