      2. A Rainy Recess
      Composition: It was recess and rain was very big. We cannot go playground. Me and Jia Min sit in class. We play a game with paper. The paper fly to the floor because the fan. Our teacher told us pick it up. Then we draw a house and a sun. Soon the bell ring. Rainy recess was not fun but the drawing is nice.
